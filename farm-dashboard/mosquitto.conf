# mosquitto.conf
# Local Mosquitto broker config for Leks' Farm Dashboard
# Place this file anywhere and run: mosquitto -c mosquitto.conf

# ── Listener ──────────────────────────────────────────────────────────────────
# Standard MQTT port (for Node.js backend + simulator)
listener 1883
allow_anonymous true

# WebSocket port (for the React frontend — mqtt.js uses WebSockets in browser)
listener 9001
protocol websockets
allow_anonymous true

# ── Logging ───────────────────────────────────────────────────────────────────
log_type all
log_dest stdout
